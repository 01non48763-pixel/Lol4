<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Barraquinha da Morena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #eef7f1; color: #102a1c; padding: 16px; }
    .box { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; color: #064e3b; margin-bottom: 10px; }
    h2 { font-size: 16px; color: #064e3b; margin: 16px 0 8px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #bfd8c8; border-radius: 8px; font-size: 14px; }
    button { background: #047857; color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:active { background: #064e3b; }
    .btn-pago { background: #b45309; }
    .btn-entregue { background: #047857; }
    .btn-pendente { background: #476657; }
    .btn-remover { background: #b91c1c; }
    .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .abas { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .aba-ativa { background: #064e3b; outline: 2px solid #047857; }
    .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .resumo-card { background: #f9fdfb; border: 1px solid #cde3d5; border-radius: 10px; padding: 10px; text-align: center; }
    .pedido, .item-preco { border: 1px solid #cde3d5; border-radius: 10px; padding: 12px; margin-top: 10px; background: #f9fdfb; }
    .linha { margin-top: 5px; font-size: 14px; }
    .detalhe-itens { margin-top: 8px; padding: 8px 10px; background: #ffffff; border-radius: 8px; border: 1px dashed #bfd8c8; font-size: 13px; }
    .acoes { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .grid-add { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; margin-top: 8px; }
    .linha-preco { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .erro { color: #b91c1c; font-weight: bold; margin-top: 8px; font-size: 13px; }
    .ok { color: #047857; font-weight: bold; margin-top: 8px; font-size: 13px; }
    @media (max-width: 600px) {
      .grid-add { grid-template-columns: 1fr; }
      .resumo { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="box" id="telaLogin">
    <h1>Admin - Barraquinha da Morena</h1>
    <input type="password" id="pin" placeholder="Digite o PIN (1234)" />
    <button id="btnEntrar">Entrar</button>
    <div class="erro" id="erroPin"></div>
  </div>

  <div class="box" id="telaAdmin" style="display:none;">
    <div class="topo">
      <h1>Painel Administrativo</h1>
      <button id="btnAtualizar">Atualizar Tudo</button>
    </div>

    <div class="abas">
      <button id="abaPedidos" class="aba-ativa">Pedidos Detalhados</button>
      <button id="abaPrecos" style="background:#476657;">Preços (Verduras e Legumes)</button>
    </div>

    <div id="secaoPedidos">
      <div class="resumo">
        <div class="resumo-card">
          <div>Pedidos Feitos</div>
          <strong id="qtdFeitos">0</strong>
        </div>
        <div class="resumo-card">
          <div>Pagos</div>
          <strong id="qtdPagos">0</strong>
        </div>
        <div class="resumo-card">
          <div>Entregues</div>
          <strong id="qtdEntregues">0</strong>
        </div>
      </div>
      <div id="listaPedidos">Carregando pedidos...</div>
    </div>

    <div id="secaoPrecos" style="display:none;">
      <h2>Adicionar ou Atualizar Verdura / Legume</h2>
      <div class="grid-add">
        <input type="text" id="novoNome" placeholder="Ex: Cenoura, Cebola, Batata" />
        <select id="novoTipo">
          <option value="Legume">Legume</option>
          <option value="Verdura">Verdura</option>
        </select>
        <input type="number" step="0.01" min="0" id="novoPreco" placeholder="Preço (ex: 1.00)" />
        <button id="btnSalvarNovo">Salvar Item</button>
      </div>
      <div id="msgPreco"></div>
      <div id="listaPrecos">Carregando itens...</div>
    </div>
  </div>

  <script>
    const DB_URL = "https://barraquinha-49cdc-default-rtdb.firebaseio.com";
    const PIN = "1234";
    let loopPedidos = null;

    const PRECOS_PADRAO = {
      tomate_teste: { nome: "Tomate Teste", categoria: "Legume", preco: 1.00 },
      tomate: { nome: "Tomate", categoria: "Legume", preco: 4.00 },
      cenoura: { nome: "Cenoura", categoria: "Legume", preco: 3.50 },
      cebola: { nome: "Cebola", categoria: "Legume", preco: 3.00 },
      batata: { nome: "Batata", categoria: "Legume", preco: 1.00 },
      alface: { nome: "Alface", categoria: "Verdura", preco: 2.50 },
      couve: { nome: "Couve", categoria: "Verdura", preco: 2.50 },
      cheiro_verde: { nome: "Cheiro-verde", categoria: "Verdura", preco: 2.00 }
    };

    function formatarBRL(valor) {
      const num = Number(valor) || 0;
      return num.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function slugify(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_|_$/g, "");
    }

    document.getElementById("btnEntrar").addEventListener("click", function () {
      const digitado = document.getElementById("pin").value.trim();
      if (digitado !== PIN) {
        document.getElementById("erroPin").textContent = "PIN incorreto. Use 1234.";
        return;
      }
      document.getElementById("erroPin").textContent = "";
      document.getElementById("telaLogin").style.display = "none";
      document.getElementById("telaAdmin").style.display = "block";
      carregarPedidos();
      carregarPrecos();
      loopPedidos = setInterval(carregarPedidos, 4000);
    });

    document.getElementById("abaPedidos").addEventListener("click", function () {
      document.getElementById("secaoPedidos").style.display = "block";
      document.getElementById("secaoPrecos").style.display = "none";
      document.getElementById("abaPedidos").classList.add("aba-ativa");
      document.getElementById("abaPedidos").style.background = "#047857";
      document.getElementById("abaPrecos").classList.remove("aba-ativa");
      document.getElementById("abaPrecos").style.background = "#476657";
      carregarPedidos();
    });

    document.getElementById("abaPrecos").addEventListener("click", function () {
      document.getElementById("secaoPedidos").style.display = "none";
      document.getElementById("secaoPrecos").style.display = "block";
      document.getElementById("abaPrecos").classList.add("aba-ativa");
      document.getElementById("abaPrecos").style.background = "#047857";
      document.getElementById("abaPedidos").classList.remove("aba-ativa");
      document.getElementById("abaPedidos").style.background = "#476657";
      carregarPrecos();
    });

    document.getElementById("btnAtualizar").addEventListener("click", function () {
      carregarPedidos();
      carregarPrecos();
    });

    function montarDetalheItens(p) {
      if (Array.isArray(p.itens) && p.itens.length > 0) {
        let soma = 0;
        const linhas = p.itens.map(function (it) {
          const qtd = Number(it.qtd || it.quantidade || 1);
          const unit = Number(it.precoUnitario || it.preco || 0);
          const subtotal = Number(it.subtotal || (qtd * unit));
          soma += subtotal;
          return "<div>• " + (it.nome || it.item || "Item") + " — " + qtd + "x " + formatarBRL(unit) + " = <strong>" + formatarBRL(subtotal) + "</strong></div>";
        }).join("");
        return { html: linhas, totalCalculado: soma };
      }

      const itemUnico = p.item || "Tomate Teste";
      const qtdUnica = Number(p.qtd || p.quantidade || 1);
      const valorTexto = p.total || "R$ 1,00";
      const numeroExtraido = Number(String(valorTexto).replace(/[^\d,.-]/g, "").replace(",", "."));
      const totalNum = !isNaN(numeroExtraido) && numeroExtraido > 0 ? numeroExtraido : 1;
      const unitNum = qtdUnica > 0 ? totalNum / qtdUnica : totalNum;

      return {
        html: "<div>• " + itemUnico + " — " + qtdUnica + "x " + formatarBRL(unitNum) + " = <strong>" + formatarBRL(totalNum) + "</strong></div>",
        totalCalculado: totalNum
      };
    }

    async function carregarPedidos() {
      const area = document.getElementById("listaPedidos");
      try {
        const res = await fetch(DB_URL + "/pedidos.json");
        if (!res.ok) {
          area.innerHTML = '<div class="erro">Erro ao ler pedidos (' + res.status + ').</div>';
          return;
        }
        const dados = await res.json();
        if (!dados) {
          document.getElementById("qtdFeitos").textContent = "0";
          document.getElementById("qtdPagos").textContent = "0";
          document.getElementById("qtdEntregues").textContent = "0";
          area.innerHTML = "<p>Nenhum pedido feito até agora.</p>";
          return;
        }

        const chaves = Object.keys(dados).reverse();
        let feitos = 0;
        let pagos = 0;
        let entregues = 0;

        const html = chaves.map(function (idFirebase) {
          const p = dados[idFirebase] || {};
          const status = p.status || "Pedido feito";

          if (status === "Pedido feito" || status === "Pendente") feitos++;
          if (status === "Pago") pagos++;
          if (status === "Entregue") entregues++;

          const detalhe = montarDetalheItens(p);
          const totalExibido = p.total || formatarBRL(detalhe.totalCalculado);

          return (
            '<div class="pedido">' +
              '<div><strong>' + (p.id || idFirebase) + '</strong> — ' + (p.cliente || "Cliente") + '</div>' +
              '<div class="linha"><strong>Endereço:</strong> ' + (p.endereco || "-") + '</div>' +
              '<div class="linha"><strong>Situação:</strong> <strong>' + status + '</strong></div>' +
              '<div class="detalhe-itens">' +
                '<div><strong>Itens do pedido:</strong></div>' +
                detalhe.html +
                '<div style="margin-top:6px;"><strong>Total do pedido: ' + totalExibido + '</strong></div>' +
              '</div>' +
              '<div class="linha" style="font-size:12px;color:#476657;">' + (p.data || "") + '</div>' +
              '<div class="acoes">' +
                '<button class="btn-pendente" onclick="setStatus(\'' + idFirebase + '\', \'Pedido feito\')">Pedido feito</button>' +
                '<button class="btn-pago" onclick="setStatus(\'' + idFirebase + '\', \'Pago\')">Pago</button>' +
                '<button class="btn-entregue" onclick="setStatus(\'' + idFirebase + '\', \'Entregue\')">Entregue</button>' +
              '</div>' +
            '</div>'
          );
        }).join("");

        document.getElementById("qtdFeitos").textContent = String(feitos);
        document.getElementById("qtdPagos").textContent = String(pagos);
        document.getElementById("qtdEntregues").textContent = String(entregues);
        area.innerHTML = html;
      } catch (e) {
        area.innerHTML = '<div class="erro">Erro de conexão ao carregar pedidos: ' + e.message + '</div>';
      }
    }

    async function setStatus(idFirebase, novoStatus) {
      try {
        const res = await fetch(DB_URL + "/pedidos/" + idFirebase + ".json", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: novoStatus })
        });
        if (res.ok) {
          carregarPedidos();
        } else {
          alert("Erro ao atualizar status (" + res.status + ").");
        }
      } catch (e) {
        alert("Falha ao salvar status no Firebase.");
      }
    }

    async function carregarPrecos() {
      const lista = document.getElementById("listaPrecos");
      try {
        const res = await fetch(DB_URL + "/produtos.json");
        if (!res.ok) {
          lista.innerHTML = '<div class="erro">Erro ao carregar preços (' + res.status + ').</div>';
          return;
        }
        let produtos = await res.json();
        if (!produtos) {
          produtos = PRECOS_PADRAO;
          await fetch(DB_URL + "/produtos.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(produtos)
          });
        }

        const chaves = Object.keys(produtos);
        lista.innerHTML = chaves.map(function (chave) {
          const item = produtos[chave] || {};
          const precoAtual = Number(item.preco || 0).toFixed(2);
          return (
            '<div class="item-preco">' +
              '<div class="linha-preco">' +
                '<div><strong>' + (item.nome || chave) + '</strong> (' + (item.categoria || "Item") + ')</div>' +
                '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
                  '<input type="number" step="0.01" min="0" id="preco_' + chave + '" value="' + precoAtual + '" style="width:105px;" />' +
                  '<button onclick="salvarPrecoExistente(\'' + chave + '\')">Salvar</button>' +
                  '<button class="btn-remover" onclick="removerProduto(\'' + chave + '\')">Excluir</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join("");
      } catch (e) {
        lista.innerHTML = '<div class="erro">Erro ao carregar tabela de preços: ' + e.message + '</div>';
      }
    }

    document.getElementById("btnSalvarNovo").addEventListener("click", async function () {
      const nome = document.getElementById("novoNome").value.trim();
      const categoria = document.getElementById("novoTipo").value;
      const preco = Number(document.getElementById("novoPreco").value);
      const msg = document.getElementById("msgPreco");

      if (!nome || isNaN(preco) || preco < 0) {
        msg.innerHTML = '<div class="erro">Informe um nome válido e um preço (ex: 1.00 ou 2.50).</div>';
        return;
      }

      const id = slugify(nome) || ("item_" + Date.now());
      try {
        const res = await fetch(DB_URL + "/produtos/" + id + ".json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome: nome, categoria: categoria, preco: preco })
        });
        if (res.ok) {
          document.getElementById("novoNome").value = "";
          document.getElementById("novoPreco").value = "";
          msg.innerHTML = '<div class="ok">Salvo: ' + nome + ' por ' + formatarBRL(preco) + '.</div>';
          carregarPrecos();
        } else {
          msg.innerHTML = '<div class="erro">Não foi possível salvar (' + res.status + ').</div>';
        }
      } catch (e) {
        msg.innerHTML = '<div class="erro">Erro de conexão ao salvar item.</div>';
      }
    });

    async function salvarPrecoExistente(chave) {
      const campo = document.getElementById("preco_" + chave);
      const msg = document.getElementById("msgPreco");
      const novoPreco = Number(campo.value);
      if (isNaN(novoPreco) || novoPreco < 0) {
        msg.innerHTML = '<div class="erro">Digite um valor válido.</div>';
        return;
      }
      try {
        const res = await fetch(DB_URL + "/produtos/" + chave + ".json", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ preco: novoPreco })
        });
        if (res.ok) {
          msg.innerHTML = '<div class="ok">Preço atualizado para ' + formatarBRL(novoPreco) + '.</div>';
          carregarPrecos();
        } else {
          msg.innerHTML = '<div class="erro">Erro ao atualizar preço (' + res.status + ').</div>';
        }
      } catch (e) {
        msg.innerHTML = '<div class="erro">Erro de conexão ao atualizar preço.</div>';
      }
    }

    async function removerProduto(chave) {
      try {
        await fetch(DB_URL + "/produtos/" + chave + ".json", { method: "DELETE" });
        carregarPrecos();
      } catch (e) {
        alert("Erro ao excluir item.");
      }
    }
  </script>
</body>
</html>
